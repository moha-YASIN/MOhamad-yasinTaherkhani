<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        snippet
    </title>
    <style type="text/css">
        :root {
            --container-paddding: 20px;
            --input-padding-vertical: 6px;
            --input-padding-horizontal: 4px;
            --input-margin-vertical: 4px;
            --input-margin-horizontal: 0;
        }

        body {
            padding: 0 var(--container-paddding);
            color: var(--vscode-foreground);
            font-size: var(--vscode-font-size);
            font-weight: var(--vscode-font-weight);
            font-family: var(--vscode-font-family);
            background-color: var(--vscode-editor-background);
        }

        ol,
        ul {
            padding-left: var(--container-paddding);
        }

        body>*,
        form>* {
            margin-block-start: var(--input-margin-vertical);
            margin-block-end: var(--input-margin-vertical);
        }

        *:focus {
            outline-color: var(--vscode-focusBorder) !important;
        }

        a {
            color: var(--vscode-textLink-foreground);
        }

        a:hover,
        a:active {
            color: var(--vscode-textLink-activeForeground);
        }

        code {
            font-size: var(--vscode-editor-font-size);
            font-family: var(--vscode-editor-font-family);
        }

        button {
            border: none;
            flex-basis: calc(50% - 1px);
            /* 每个按钮占据50%宽度减去半个gap，以适应间距 */
            text-align: center;
            outline: 1px solid transparent;
            outline-offset: 2px !important;
            padding: var(--input-padding-vertical) var(--input-padding-horizontal);
            color: var(--vscode-button-foreground);
            background: var(--vscode-button-background);
        }

        button:hover {
            cursor: pointer;
            background: var(--vscode-button-hoverBackground);
        }

        button:focus {
            outline-color: var(--vscode-focusBorder);
        }

        button.secondary {
            color: var(--vscode-button-secondaryForeground);
            background: var(--vscode-button-secondaryBackground);
        }

        button.secondary:hover {
            background: var(--vscode-button-secondaryHoverBackground);
        }

        input:not([type="checkbox"]),
        textarea {
            display: block;
            width: 100%;
            border: none;
            font-family: var(--vscode-font-family);
            padding: var(--input-padding-vertical) var(--input-padding-horizontal);
            color: var(--vscode-input-foreground);
            outline-color: var(--vscode-input-border);
            background-color: var(--vscode-input-background);
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--vscode-input-placeholderForeground);
        }



        .text {
            margin: 0 10px;
            /* 文字与开关之间的间距 */
        }

        .switch-container {
            margin: 0 20px;
            /* 开关与文字之间的间距 */
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            /* 减小宽度 */
            height: 20px;
            /* 减小高度 */
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            /* 减小滑块的高度 */
            width: 16px;
            /* 减小滑块的宽度 */
            left: 2px;
            /* 调整初始位置 */
            bottom: 2px;
            /* 调整初始位置 */
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
        }

        input:checked+.slider {
            background-color: #2196F3;
        }

        input:focus+.slider {
            box-shadow: 0 0 1px #2196F3;
        }

        input:checked+.slider:before {
            -webkit-transform: translateX(20px);
            /* 调整滑块移动的距离 */
            -ms-transform: translateX(20px);
            transform: translateX(20px);
        }

        /* 圆形滑块 */
        .slider.round {
            border-radius: 20px;
            /* 调整圆角 */
        }

        .slider.round:before {
            border-radius: 50%;
        }
    </style>
</head>

<body><button title="导入matplotlib" data-snippets="import matplotlib.pyplot as plt
import numpy as np
" style="width: 48%;">导入包</button>

    <h4 style="text-align: center;">绘图</h4>
    <button title="创建折线图" data-snippets="fig, ax = plt.subplots(constrained_layout=True)

# 数据x,y长度必须相同，更多参数：https://www.wolai.com/matplotlib/4GXojnYSjgrrezCPMMy4on

" style="width: 48%;">折线图</button>
    <button title="带有误差信息的折线图，支持上下误差不同" data-snippets="fig, ax = plt.subplots(constrained_layout=True)

# yerr,xerr为上下和左右误差，通常只指定一个
# capsize,capthick为误差棒长宽，ecolor为误差棒颜色
# 更多参数：https://www.wolai.com/matplotlib/6QuMVNfhxsMMnMp7VSpkUk
ax.errorbar(x, y, yerr, marker=&quot;s&quot;, capsize=4, capthick=2, ecolor=&quot;k&quot;, label=&quot;y&quot;)

# 设置坐标轴标签
ax.set_xlabel(&quot;X (unit)&quot;, fontweight=&quot;bold&quot;)
ax.set_ylabel(&quot;Y (unit)&quot;, fontweight=&quot;bold&quot;)

    <button title="创建柱状图、条形图" data-snippets="fig, ax = plt.subplots(constrained_layout=True)

# 更多参数：https://www.wolai.com/matplotlib/2mypc3HyBTyLR8TQKmxVku

    <button title="展示数据中各成分的比例" data-snippets="fig, ax = plt.subplots(constrained_layout=True)

    <button title="contour和contourf函数，要求输入一个二维数组" data-snippets="fig, ax = plt.subplots(constrained_layout=True)
# 设置坐标轴比例
ax.set_aspect(aspect=1.0)

# contour 生成等高线，contourf 填充等高线之间的区域，可单独使用也可以配合使用（levels参数相同）

    <h4 style="text-align: center;">
        侧边栏管理
    </h4>
    <div class="switch-container" style="margin: 0 auto; display: flex; align-items: center; width: fit-content;">
        <span class="text">原生</span>
        <label class="switch">
            <input type="checkbox" id="sidebarToggle">
            <span class="slider round"></span>
        </label>
        <span class="text">个性</span>
    </div>
    <button id="modify" title="自定义侧边栏视图" style="width: 48%;">自定义</button>
    <button id="refresh" title="刷新侧边栏视图，重启VS Code生效" style="width: 48%;">刷新</button>

    <p>&nbsp;</p>
    <p>&nbsp;</p>

    <script type="text/javascript">
        const vscode = acquireVsCodeApi();

        //document.getElementById('tsidebarToggle').checked = true;

        const buttons = document.querySelectorAll('button');

        buttons.forEach(button => {
            button.addEventListener('click', function (event) {
                vscode.postMessage({
                    "id": this.id,
                    "snippets": this.dataset.snippets,
                    "event": "click"
                });
            });
        });

        document.addEventListener('DOMContentLoaded', function () {
            const colorPicker = document.getElementById('color');
            const colorValueDisplay = document.getElementById('colorValue');

            // 监听颜色选择器的 input 事件
            colorPicker.addEventListener('input', function (event) {
                const newColor = event.target.value;
                colorValueDisplay.textContent = newColor;

            });

            colorPicker.addEventListener('blur', function () {
                copyColorValue();
            });
        });

        // 复制颜色值的函数
        function copyColorValue() {
            const colorValueDisplay = document.getElementById('colorValue');
            const colorValue = colorValueDisplay.textContent.trim();
            navigator.clipboard.writeText(colorValue);
        }

        const toggleSwitch = document.getElementById('sidebarToggle');
        toggleSwitch.addEventListener('change', function () {
            const slider = this.nextElementSibling;
            if (this.checked) {
                vscode.postMessage({
                    "id": "toggleBar",
                    "native": false
                });
            } else {
                vscode.postMessage({
                    "id": "toggleBar",
                    "native": true
                });
            }
        });
    </script>
