<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>snippet</title>
    <style type="text/css">
      :root {
        --container-paddding: 20px;
        --input-padding-vertical: 6px;
        --input-padding-horizontal: 4px;
        --input-margin-vertical: 4px;
        --input-margin-horizontal: 0;
      }

      body {
        padding: 0 var(--container-paddding);
        color: var(--vscode-foreground);
        font-size: var(--vscode-font-size);
        font-weight: var(--vscode-font-weight);
        font-family: var(--vscode-font-family);
        background-color: var(--vscode-editor-background);
      }

      ol,
      ul {
        padding-left: var(--container-paddding);
      }

      body > *,
      form > * {
        margin-block-start: var(--input-margin-vertical);
        margin-block-end: var(--input-margin-vertical);
      }

      *:focus {
        outline-color: var(--vscode-focusBorder) !important;
      }

      a {
        color: var(--vscode-textLink-foreground);
      }

      a:hover,
      a:active {
        color: var(--vscode-textLink-activeForeground);
      }

      code {
        font-size: var(--vscode-editor-font-size);
        font-family: var(--vscode-editor-font-family);
      }

      button {
        border: none;
        flex-basis: calc(50% - 1px);
        /* 每个按钮占据50%宽度减去半个gap，以适应间距 */
        text-align: center;
        outline: 1px solid transparent;
        outline-offset: 2px !important;
        padding: var(--input-padding-vertical) var(--input-padding-horizontal);
        color: var(--vscode-button-foreground);
        background: var(--vscode-button-background);
      }

      button:hover {
        cursor: pointer;
        background: var(--vscode-button-hoverBackground);
      }

      button:focus {
        outline-color: var(--vscode-focusBorder);
      }

      button.secondary {
        color: var(--vscode-button-secondaryForeground);
        background: var(--vscode-button-secondaryBackground);
      }

      button.secondary:hover {
        background: var(--vscode-button-secondaryHoverBackground);
      }

      input:not([type="checkbox"]),
      textarea {
        display: block;
        width: 100%;
        border: none;
        font-family: var(--vscode-font-family);
        padding: var(--input-padding-vertical) var(--input-padding-horizontal);
        color: var(--vscode-input-foreground);
        outline-color: var(--vscode-input-border);
        background-color: var(--vscode-input-background);
      }

      input::placeholder,
      textarea::placeholder {
        color: var(--vscode-input-placeholderForeground);
      }

      .text {
        margin: 0 10px;
        /* 文字与开关之间的间距 */
      }

      .switch-container {
        margin: 0 20px;
        /* 开关与文字之间的间距 */
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 40px;
        /* 减小宽度 */
        height: 20px;
        /* 减小高度 */
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        -webkit-transition: 0.4s;
        transition: 0.4s;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 16px;
        /* 减小滑块的高度 */
        width: 16px;
        /* 减小滑块的宽度 */
        left: 2px;
        /* 调整初始位置 */
        bottom: 2px;
        /* 调整初始位置 */
        background-color: white;
        -webkit-transition: 0.4s;
        transition: 0.4s;
      }

      input:checked + .slider {
        background-color: #2196f3;
      }

      input:focus + .slider {
        box-shadow: 0 0 1px #2196f3;
      }

      input:checked + .slider:before {
        -webkit-transform: translateX(20px);
        /* 调整滑块移动的距离 */
        -ms-transform: translateX(20px);
        transform: translateX(20px);
      }

      /* 圆形滑块 */
      .slider.round {
        border-radius: 20px;
        /* 调整圆角 */
      }

      .slider.round:before {
        border-radius: 50%;
      }

      footer {
        background-color: var(--vscode-editor-background);
        padding: 20px 0;
      }

      .footer-content,
      .footer-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }

      .footer-content {
        margin-left: 10px;
      }

      .social-icons,
      .footer-bottom p {
        margin: 0;
      }

      .social-icons a {
        margin-right: 5px;
      }

      .social-icons img {
        width: 24px;
        height: 24px;
      }

      .footer-bottom {
        border-top: 1px solid #444;
        padding-top: 10px;
        margin-left: auto;
      }
    </style>
  </head>

  <body>
    <button

    <h4 style="text-align: center">加载数据</h4>

      title="加载文本数据"

# dtype: 数据类型， float | int
# skiprows: 跳过文件开头几行
# delimiter: 文件中每行各数据的分隔符， ',' | ' '

    <button

    <h4 style="text-align: center">绘图</h4>
    <button
      title="创建折线图"
      data-snippets='fig, ax = plt.subplots(constrained_layout=True)

# 数据x,y长度必须相同，更多参数：https://www.wolai.com/matplotlib/4GXojnYSjgrrezCPMMy4on
_ = ax.plot(x, y, label="x-y")

# 设置坐标轴标签
ax.set_xlabel("X (unit)", fontweight="bold")
ax.set_ylabel("Y (unit)", fontweight="bold")

# 添加图例
_ = ax.legend()

plt.show()
'
      style="width: 48%"
    >
      折线图
    </button>
    <button
      title="带有误差信息的折线图，支持上下误差不同"
      data-snippets='fig, ax = plt.subplots(constrained_layout=True)

# yerr,xerr为上下和左右误差，通常只指定一个
# capsize,capthick为误差棒长宽，ecolor为误差棒颜色
# 更多参数：https://www.wolai.com/matplotlib/6QuMVNfhxsMMnMp7VSpkUk
ax.errorbar(x, y, yerr, marker="s", capsize=4, capthick=2, ecolor="k", label="y")

# 设置坐标轴标签
ax.set_xlabel("X (unit)", fontweight="bold")
ax.set_ylabel("Y (unit)", fontweight="bold")

# 添加图例
_ = ax.legend()

plt.show()
'
      style="width: 48%"
    >
      误差折线图
    </button>
    <button
      title="创建柱状图、条形图"
      data-snippets='fig, ax = plt.subplots(constrained_layout=True)

# bar_labels是一个字符串列表，bar_values是一个与bar_labels等长的数字列表
# 更多参数：https://www.wolai.com/matplotlib/2mypc3HyBTyLR8TQKmxVku
bars = ax.bar(bar_labels, bar_values, color="salmon")

# 为条形添加数字标签, padding是标签与条形的距离
ax.bar_label(bars, padding=3)

# 设置坐标轴标签
ax.set_xlabel("X (unit)", fontweight="bold")
ax.set_ylabel("Y (unit)", fontweight="bold")

# 添加图例
_ = ax.legend()

plt.show()
'
      style="width: 48%"
    >
      柱状图
    </button>
    <button
      title="展示数据中各成分的比例"
      data-snippets='fig, ax = plt.subplots(constrained_layout=True)

# x: 饼图中各成分比例
x = [0.3, 0.1, 0.1]
# labels: 饼图中各成分标签
labels = ["label 1", "label 2", "label 3"]

# autopct: 饼图中各成分标签的显示格式
# 更多参数：https://www.wolai.com/matplotlib/rKrwDAh6rTo7mRKpSTTopz
_ = ax.pie(x, labels=labels, autopct="%1.1f%%")

plt.show()
'
      style="width: 48%"
    >
      饼图
    </button>
    <button
      title="创建散点图"
      data-snippets='fig, ax = plt.subplots(constrained_layout=True)

# 关键字s指定散点的大小，更多参数：https://www.wolai.com/matplotlib/6QQ2tpDuAS7ggBMNP8YXbK
_ = ax.scatter(x, y, s=24, label="label")

# 设置坐标轴标签
ax.set_xlabel("X (unit)", fontweight="bold")
ax.set_ylabel("Y (unit)", fontweight="bold")

# 添加图例
_ = ax.legend()

plt.show()
'
      style="width: 48%"
    >
      散点图
    </button>
    <button
      title="imshow函数，也可用于热度图，要求输入一个二维数组"
      data-snippets='fig, ax = plt.subplots(constrained_layout=True)

# 更多参数：https://www.wolai.com/matplotlib/9S3VvdWev3tNckFvKcMHKA
im = ax.imshow(array2d, cmap="coolwarm")

# 添加颜色条，更多参数：https://www.wolai.com/matplotlib/3JLQ4xkFa9az9ed5w9FHt4
cbar = fig.colorbar(im, ax=ax, pad=0.05, shrink=1.00)
cbar.set_label("label", fontweight="bold")

plt.show()
'
      style="width: 48%"
    >
      像素图
    </button>
    <button
      title="contour和contourf函数，要求输入一个二维数组"
      data-snippets='fig, ax = plt.subplots(constrained_layout=True)
# 设置坐标轴比例
ax.set_aspect(aspect=1.0)

# contour 生成等高线，contourf 填充等高线之间的区域，可单独使用也可以配合使用（levels参数相同）
# 更多参数：https://www.wolai.com/matplotlib/5Re8LXrTNvjN5BxDcNFwwL
_ = ax.contour(
    array2d, colors="gray", alpha=0.6, levels=5, linewidths=2, linestyles="-"
)
cs = ax.contourf(array2d, levels=5, cmap="coolwarm")

# 绘制颜色条
cbar = fig.colorbar(cs, ax=ax, shrink=0.75, aspect=15)
cbar.set_label("Z", fontweight="bold", rotation=0)

# 保存图片
# plt.savefig(&apos;./等高线填充图.png&apos;, dpi=300)

# 显示图片
plt.show()
'
      style="width: 48%"
    >
      等高线图
    </button>
    <button
      title="直方统计分布图"
      data-snippets='fig, ax = plt.subplots(constrained_layout=True)

# data1, data2是一维数字列表，bins为统计区间数量
# 更多参数：https://www.wolai.com/matplotlib/nKvJ5AnignsqtTEzxnnf5G
_ = ax.hist(data1, bins=32, density=True, alpha=0.75, label="data 1")
_ = ax.hist(data2, bins=32, density=True, alpha=0.75, label="data 2")

# 设置坐标轴标签
ax.set_xlabel("X (unit)", fontweight="bold")
ax.set_ylabel("density", fontweight="bold")

_ = ax.legend(frameon=False, loc=0, title="")

plt.show()
'
      style="width: 48%"
    >
      直方图
    </button>
    <h4 style="text-align: center">轴与标签</h4>
    <button
      title="手动设置X/Y轴的上下限"
      data-snippets="# 设置X/Y轴的上下限
ax.set_xlim([x_min, x_max])
ax.set_ylim([y_min, y_max])
"
      style="width: 48%"

    <button

# labelpad: 浮点数关键字，控制标签与轴之间的距离
# fontsize: 文本字体大小,  rotation: 文本旋转角度

'
      style="width: 48%"
    >
      轴标签
    </button>

"

    <button

'

    <button

    <h4 style="text-align: center">其它常用</h4>
    <button
      title="添加图例"
      data-snippets='# ncol: 图例的列数，loc: 图例位置，"upper right", "upper left", "lower left", "center", ...
# reverse: False or True, 图例项顺序是否反转
# 更多参数详见 https://www.wolai.com/matplotlib/7Lx6EZgnxScUd2diem67W8
ax.legend()
'
      style="width: 48%"
    >
      图例
    </button>
    <button
      title="添加colorbar"
      data-snippets='# mappable 是一个可绘制的对象，比如imshow, contourf返回的对象
# shrink 标识颜色条的长度，aspect 标识颜色条的高度，pad 标识颜色条与绘图区的距离
# 更多参数详见 https://www.wolai.com/matplotlib/3JLQ4xkFa9az9ed5w9FHt4
cbar = fig.colorbar(mappable, shrink=0.8, aspect=12, pad=0.04, location="right")

# 设置颜色条的标签， y 表示颜色条的位置，labelpad 表示标签与颜色条的浮动距离
cbar.set_label("m/s", y=0.5, labelpad=-2)
'

      颜色条

# 更多参数：https://www.wolai.com/matplotlib/oAj9m2iuBGJSy7osNtaXmr
ax.annotate(

    xytext=(0.6, 0.8),
    arrowprops={
        "arrowstyle": "-|>",

    },
)

    <button

    <script type="text/javascript">
      const vscode = acquireVsCodeApi();

      //document.getElementById('tsidebarToggle').checked = true;

      const buttons = document.querySelectorAll("button");

      buttons.forEach((button) => {
        button.addEventListener("click", function (event) {
          vscode.postMessage({
            id: this.id,
            snippets: this.dataset.snippets,
            event: "click",
          });
        });
      });

      document.addEventListener("DOMContentLoaded", function () {
        const colorPicker = document.getElementById("color");
        const colorValueDisplay = document.getElementById("colorValue");

        // 监听颜色选择器的 input 事件
        colorPicker.addEventListener("input", function (event) {
          const newColor = event.target.value;
          colorValueDisplay.textContent = newColor;
        });

        colorPicker.addEventListener("blur", function () {
          copyColorValue();
        });
      });

      // 复制颜色值的函数
      function copyColorValue() {
        const colorValueDisplay = document.getElementById("colorValue");
        const colorValue = colorValueDisplay.textContent.trim();
        navigator.clipboard.writeText(colorValue);
      }

      const toggleSwitch = document.getElementById("sidebarToggle");
      toggleSwitch.addEventListener("change", function () {
        const slider = this.nextElementSibling;
        if (this.checked) {
          vscode.postMessage({
            id: "toggleBar",
            native: false,
          });
        } else {
          vscode.postMessage({
            id: "toggleBar",
            native: true,
          });
        }
      });
    </script>
